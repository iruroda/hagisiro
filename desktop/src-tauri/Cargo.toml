[package]
name = "hagisiro"
version = "2.0.0"
description = "Hagisiro 바탕화면 위젯"
authors = ["Iruroda"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

# 설치 파일을 작게: 크기 우선 최적화 + 디버그 정보 제거
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
