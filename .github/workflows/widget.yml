name: 위젯 exe 빌드
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', '.github/workflows/widget.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-latest
          name: HAGISIRO 위젯 (Windows)
          files: desktop/dist/HAGISIRO.exe
