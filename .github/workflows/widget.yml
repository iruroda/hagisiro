name: 위젯 exe 빌드
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', '.github/workflows/widget.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - name: 이전 배포 파일 지우기 (이름이 바뀌어도 겹치지 않게)
        run: gh release delete widget-latest --yes --cleanup-tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: desktop
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-latest
          name: Hagisiro 위젯 (Windows)
          files: |
            desktop/dist/Hagisiro-Setup.exe
            desktop/dist/Hagisiro.exe
